name: Deploy to GitHub Pages

# Every push to main runs the full quality gates (ci.yml and lighthouse.yml) and deploys only if
# they all pass. The site is served from GitHub Pages at the custom domain in public/CNAME.
#
# workflow_dispatch can be run on any branch as a dry run: the gates execute, but the deploy job
# only runs on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  lighthouse:
    name: Lighthouse CI
    uses: ./.github/workflows/lighthouse.yml

  deploy:
    name: Deploy
    needs: [ci, lighthouse]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The exact build that passed the gates (uploaded by ci.yml), not a fresh one.
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
