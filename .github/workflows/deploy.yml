name: Deploy to GitHub Pages

# Every push to main runs the full quality gates (ci.yml and lighthouse.yml), deploys only if they all
# pass, checks that the live site really serves the commit that was just deployed (/version.json), and
# then tags the version and publishes a GitHub Release if that version has not been released yet
# (see docs/versioning.md). The site is served from GitHub Pages at the domain in public/CNAME.
#
# workflow_dispatch can be run on any branch as a dry run: the gates execute, but the deploy job
# only runs on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  lighthouse:
    name: Lighthouse CI
    uses: ./.github/workflows/lighthouse.yml

  deploy:
    name: Deploy
    needs: [ci, lighthouse]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The exact build that passed the gates (uploaded by ci.yml), not a fresh one.
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          # Since v4 this action leaves out dotfiles by default. dist/ contains .nojekyll, so keep including it:
          # the published site stays byte-for-byte what it was.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # /version.json is built from the deployed commit. The query string bypasses the Pages CDN cache.
      - name: Verify the live site is serving this commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          url="${SITE_URL%/}/version.json"
          for attempt in $(seq 1 20); do
            live="$(curl -fsS "${url}?sha=${EXPECTED_SHA}" | jq -r '.commit' || true)"
            if [ "${live}" = "${EXPECTED_SHA}" ]; then
              echo "The live site is serving ${EXPECTED_SHA}."
              exit 0
            fi
            echo "Attempt ${attempt}/20: the live site reports '${live}', waiting for ${EXPECTED_SHA}..."
            sleep 15
          done
          echo "::error::${url} did not report commit ${EXPECTED_SHA} within 5 minutes."
          exit 1

  release:
    name: Tag & publish release
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the tag and GitHub Release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists: nothing to release."
            exit 0
          fi
          node scripts/release-notes.mjs "${version}" > "${RUNNER_TEMP}/notes.md"
          prerelease=""
          case "${version}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes-file "${RUNNER_TEMP}/notes.md" ${prerelease}
